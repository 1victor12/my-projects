<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowBoard — Kanban</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --border: #2a3040;
    --text: #e8ebf4;
    --muted: #8b93a7;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --green: #00b894;
    --amber: #fdcb6e;
    --red: #ff7675;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #1c2033 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px; border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .logo-dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 18px var(--accent); }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .5; }
  #search {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px 10px 38px; border-radius: 10px; width: 260px; font-size: 14px; outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: var(--accent); }
  main {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px; padding: 32px; max-width: 1200px; margin: 0 auto;
  }
  .column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    display: flex; flex-direction: column; max-height: calc(100vh - 140px);
    transition: border-color .15s, box-shadow .15s;
  }
  .column.drag-over { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,.25); }
  .column-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px;
  }
  .column-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; display: flex; align-items: center; gap: 8px; }
  .column-title .dot { width: 9px; height: 9px; border-radius: 3px; }
  .count {
    background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 2px 10px; border-radius: 999px;
  }
  .cards { flex: 1; overflow-y: auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .cards::-webkit-scrollbar { width: 8px; }
  .cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: grab; user-select: none;
    transition: transform .12s, box-shadow .12s, opacity .12s, border-color .12s;
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card:hover { border-color: #39415a; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .card.dragging { opacity: .45; transform: rotate(2deg) scale(1.02); }
  .card-text { font-size: 14px; line-height: 1.45; word-break: break-word; outline: none; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
  .card-text[contenteditable="true"] { background: rgba(108,92,231,.12); box-shadow: 0 0 0 1.5px var(--accent); cursor: text; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .card-date { font-size: 11px; color: var(--muted); }
  .del-btn {
    background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
    border-radius: 6px; display: flex; opacity: 0; transition: opacity .15s, color .15s, background .15s;
  }
  .card:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--red); background: rgba(255,118,117,.12); }
  .add-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .add-input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 13px; outline: none; transition: border-color .2s;
  }
  .add-input::placeholder { color: var(--muted); }
  .add-input:focus { border-color: var(--accent); }
  .add-btn {
    background: linear-gradient(135deg, var(--accent), #8f7bff); color: white; border: none;
    width: 40px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: 600;
    transition: filter .15s, transform .1s;
  }
  .add-btn:hover { filter: brightness(1.15); }
  .add-btn:active { transform: scale(.94); }
  .empty {
    text-align: center; color: var(--muted); font-size: 12.5px; padding: 26px 10px;
    border: 1.5px dashed var(--border); border-radius: 12px;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0 28px; }
  footer button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 12px; transition: all .15s; }
  footer button:hover { color: var(--red); border-color: var(--red); }
  @media (max-width: 700px) {
    header { flex-direction: column; gap: 14px; }
    main { grid-template-columns: 1fr; }
    .column { max-height: 60vh; }
  }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); padding: 7px 12px; border-radius: 10px; }
  .user-badge b { color: var(--accent-2); }
  .mini-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 6px; }
  .mini-btn:hover { color: var(--red); }
  #installBtn, #loginBtnTop {
    background: linear-gradient(135deg, var(--accent), #8f7bff); color: white; border: none;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: filter .15s;
  }
  #installBtn:hover, #loginBtnTop:hover { filter: brightness(1.15); }
  #installBtn { display: none; }
  #installBtn.show { display: inline-block; }
  #syncState { font-size: 11px; color: var(--muted); min-width: 60px; text-align: center; }
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 12, 18, .82); backdrop-filter: blur(6px);
  }
  .auth-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 34px 30px; width: min(92vw, 380px); box-shadow: 0 24px 80px rgba(0,0,0,.6);
    animation: pop .25s ease;
  }
  .auth-card h2 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .auth-sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .auth-field { margin-bottom: 12px; }
  .auth-field label { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .auth-field input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s;
  }
  .auth-field input:focus { border-color: var(--accent); }
  .auth-main-btn {
    width: 100%; background: linear-gradient(135deg, var(--accent), #8f7bff); color: white; border: none;
    padding: 13px; border-radius: 10px; font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 8px;
    transition: filter .15s, transform .1s;
  }
  .auth-main-btn:hover { filter: brightness(1.12); }
  .auth-main-btn:active { transform: scale(.985); }
  .auth-alt { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--accent-2); cursor: pointer; font-size: 13px; padding: 0; }
  .link-btn:hover { text-decoration: underline; }
  .auth-err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171a23">
</head>
<body>

<div class="overlay" id="authOverlay" style="display:none">
  <div class="auth-card">
    <h2><span class="logo-dot"></span><span id="authTitle">Welcome back</span></h2>
    <div class="auth-sub">Sign in so your board is waiting for you — on any device.</div>
    <div class="auth-field">
      <label>Username</label>
      <input id="authUser" type="text" maxlength="20" autocomplete="username">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input id="authPass" type="password" maxlength="72" autocomplete="current-password">
    </div>
    <button class="auth-main-btn" id="authGo">Sign in</button>
    <div class="auth-err" id="authErr"></div>
    <div class="auth-alt">
      <span id="authSwitchWrap"><span id="authSwitchText">New here?</span> <button class="link-btn" id="authSwitch">Create account</button></span>
      <button class="link-btn" id="guestBtn">Continue as guest</button>
    </div>
  </div>
</div>

<header>
  <div class="logo"><span class="logo-dot"></span>FlowBoard</div>
  <div class="hdr-right">
    <span id="syncState"></span>
    <div class="user-badge" id="userBadge" style="display:none"><b id="userName"></b><button class="mini-btn" id="logoutBtn" title="Log out">✕</button></div>
    <button id="loginBtnTop">Sign in</button>
    <button id="installBtn">Install App</button>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search cards...">
    </div>
  </div>
</header>

<main id="board"></main>

<footer><span id="stats"></span> &nbsp;·&nbsp; <button id="clear">Clear board</button></footer>

<script>
const COLUMNS = [
  { id: 'todo', label: 'To Do', dot: '#6c5ce7' },
  { id: 'doing', label: 'In Progress', dot: '#fdcb6e' },
  { id: 'done', label: 'Done', dot: '#00b894' }
];
const STORE_KEY = 'flowboard.v1';
const AUTH_KEY = 'flowboard.auth';
const $ = id => document.getElementById(id);
let state = loadLocal();
let auth = null;
try { auth = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch {}
let query = '';

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return sampleBoard();
}
function sampleBoard() {
  return {
    todo: [
      { id: crypto.randomUUID(), text: 'Welcome! Drag me to another column 👋', created: Date.now() },
      { id: crypto.randomUUID(), text: 'Click any card text to edit it', created: Date.now() }
    ],
    doing: [{ id: crypto.randomUUID(), text: 'Build something awesome', created: Date.now() }],
    done: []
  };
}
function isEmptyBoard(b) {
  return !b || (!b.todo.length && !b.doing.length && !b.done.length);
}

let syncT = null;
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  if (auth) {
    $('syncState').textContent = 'saving…';
    clearTimeout(syncT);
    syncT = setTimeout(syncNow, 500);
  }
}
async function syncNow() {
  try {
    const r = await fetch('/api/board', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': auth.token },
      body: JSON.stringify(state)
    });
    if (r.status === 401) return logout();
    if (!r.ok) throw 0;
    $('syncState').textContent = 'saved ✓';
  } catch {
    $('syncState').textContent = 'offline';
  }
}
function api(path, opts = {}) {
  opts.headers = Object.assign({ 'X-Token': (auth && auth.token) || '' }, opts.headers || {});
  return fetch(path, opts).then(async r => {
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  });
}

const board = $('board');
const searchEl = $('search');

function cardEl(colId, card) {
  const el = document.createElement('article');
  el.className = 'card';
  el.draggable = true;
  el.dataset.id = card.id;
  el.dataset.col = colId;
  el.dataset.text = card.text.toLowerCase();
  const d = new Date(card.created);
  el.innerHTML = `
    <div class="card-text" contenteditable="true" spellcheck="false"></div>
    <div class="card-meta">
      <span class="card-date">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
      <button class="del-btn" title="Delete card">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14"/></svg>
      </button>
    </div>`;
  const txt = el.querySelector('.card-text');
  txt.textContent = card.text;
  txt.addEventListener('blur', () => {
    const v = txt.textContent.trim();
    if (v) { card.text = v; } else if (confirm('Empty card — delete it?')) { removeCard(colId, card.id); return; }
    txt.textContent = card.text;
    el.dataset.text = card.text.toLowerCase();
    save();
  });
  txt.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); txt.blur(); }
    if (e.key === 'Escape') { txt.textContent = card.text; txt.blur(); }
  });
  el.querySelector('.del-btn').addEventListener('click', () => removeCard(colId, card.id));
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', JSON.stringify({ from: colId, id: card.id }));
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

function render() {
  const frag = document.createDocumentFragment();
  let total = 0;
  for (const col of COLUMNS) {
    total += state[col.id].length;
    const colEl = document.createElement('section');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;
    colEl.innerHTML = `
      <div class="column-head">
        <div class="column-title"><span class="dot" style="background:${col.dot}"></span>${col.label}</div>
        <span class="count">0</span>
      </div>
      <div class="cards" data-drop="${col.id}"></div>
      <form class="add-form">
        <input class="add-input" type="text" placeholder="Add a card..." maxlength="200" data-add="${col.id}">
        <button class="add-btn" type="submit">+</button>
      </form>`;
    frag.appendChild(colEl);
    const list = colEl.querySelector('.cards');
    for (const card of state[col.id]) list.appendChild(cardEl(col.id, card));

    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('drag-over'); });
    colEl.addEventListener('dragleave', e => { if (!colEl.contains(e.relatedTarget)) colEl.classList.remove('drag-over'); });
    colEl.addEventListener('drop', e => {
      e.preventDefault();
      colEl.classList.remove('drag-over');
      try {
        const { from, id } = JSON.parse(e.dataTransfer.getData('text/plain'));
        moveCard(from, col.id, id);
      } catch {}
    });

    colEl.querySelector('.add-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = e.target.querySelector('.add-input');
      const v = input.value.trim();
      if (!v) return;
      state[col.id].push({ id: crypto.randomUUID(), text: v, created: Date.now() });
      input.value = '';
      list.appendChild(cardEl(col.id, state[col.id][state[col.id].length - 1]));
      updateCounts();
      save();
      list.scrollTo({ top: 99999, behavior: 'smooth' });
    });
  }
  board.replaceChildren(frag);
  applyFilter(true);
  updateStats(total);
}

function updateCounts() {
  let total = 0;
  for (const colEl of board.children) {
    const id = colEl.dataset.colId;
    total += state[id].length;
    const vis = [...colEl.querySelectorAll('.card')].filter(c => c.style.display !== 'none').length;
    colEl.querySelector('.count').textContent = vis;
  }
  updateStats(total);
}
function updateStats(total) {
  $('stats').textContent = `${total} card${total === 1 ? '' : 's'} · ${auth ? 'synced to ' + auth.user : 'saved locally'}`;
}

function applyFilter(full) {
  for (const colEl of board.children) {
    let vis = 0;
    const cards = colEl.querySelectorAll('.card');
    const list = colEl.querySelector('.cards');
    let empty = list.querySelector('.empty');
    for (const c of cards) {
      const show = !query || c.dataset.text.includes(query);
      c.style.display = show ? '' : 'none';
      if (show) vis++;
    }
    if (vis === 0 && cards.length === 0 && !(full && query)) {
      if (!empty) { empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'Drop cards here'; list.appendChild(empty); }
    } else if (vis === 0 && query && cards.length > 0) {
      if (!empty) { empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'No matches'; list.appendChild(empty); }
    } else if (empty) empty.remove();
    colEl.querySelector('.count').textContent = vis;
  }
}

function removeCard(colId, id) {
  state[colId] = state[colId].filter(c => c.id !== id);
  const el = board.querySelector(`.card[data-id="${id}"]`);
  if (el) el.remove();
  save(); updateCounts();
}

function moveCard(from, to, id) {
  if (from === to) return;
  const idx = state[from].findIndex(c => c.id === id);
  if (idx === -1) return;
  const [card] = state[from].splice(idx, 1);
  state[to].push(card);
  save(); render();
}

searchEl.addEventListener('input', () => {
  query = searchEl.value.trim().toLowerCase();
  applyFilter();
});

$('clear').addEventListener('click', () => {
  if (!confirm('Delete ALL cards on the board?')) return;
  state = { todo: [], doing: [], done: [] };
  save(); render();
});

function setAuthed(name) {
  $('userBadge').style.display = '';
  $('userName').textContent = name;
  $('loginBtnTop').style.display = 'none';
  $('authOverlay').style.display = 'none';
  updateCounts();
}
function logout() {
  localStorage.removeItem(AUTH_KEY);
  location.reload();
}
$('logoutBtn').addEventListener('click', logout);

let mode = 'login';
function openAuth(m) {
  mode = m;
  $('authTitle').textContent = m === 'login' ? 'Welcome back' : 'Create your account';
  $('authGo').textContent = m === 'login' ? 'Sign in' : 'Sign up';
  $('authSwitchText').textContent = m === 'login' ? 'New here?' : 'Already have an account?';
  $('authSwitch').textContent = m === 'login' ? 'Create account' : 'Sign in instead';
  $('authErr').textContent = '';
  $('authOverlay').style.display = '';
  $('authUser').focus();
}
$('loginBtnTop').addEventListener('click', () => openAuth('login'));
$('authSwitch').addEventListener('click', () => openAuth(mode === 'login' ? 'register' : 'login'));
$('guestBtn').addEventListener('click', () => { $('authOverlay').style.display = 'none'; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('authOverlay').style.display = 'none'; });

$('authGo').addEventListener('click', async () => {
  const u = $('authUser').value.trim();
  const pw = $('authPass').value;
  $('authGo').disabled = true;
  $('authErr').textContent = '';
  try {
    const d = await api('/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ u, pw })
    });
    auth = { token: d.token, user: d.user };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    setAuthed(d.user);
    const remote = await api('/api/board');
    if (remote && !isEmptyBoard(remote)) {
      state = remote;
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      render();
    } else if (!isEmptyBoard(state)) {
      await syncNow();
    }
    $('syncState').textContent = 'saved ✓';
  } catch (e) {
    $('authErr').textContent = e.message;
  } finally {
    $('authGo').disabled = false;
  }
});
$('authPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('authGo').click(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEv = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installEv = e;
  $('installBtn').classList.add('show');
});
$('installBtn').addEventListener('click', async () => {
  if (!installEv) return;
  installEv.prompt();
  await installEv.userChoice;
  installEv = null;
  $('installBtn').classList.remove('show');
});

render();
(async () => {
  if (!auth) { openAuth('login'); return; }
  try {
    const me = await api('/api/me');
    setAuthed(me.user);
    const remote = await api('/api/board');
    if (remote && !isEmptyBoard(remote)) {
      state = remote;
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      render();
    } else if (!isEmptyBoard(state)) {
      await syncNow();
    } else {
      $('syncState').textContent = 'saved ✓';
    }
  } catch {
    auth = null;
    openAuth('login');
  }
})();
</script>
</body>
</html>
